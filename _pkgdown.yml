url: https://famish.netlify.app

# Keep the published site on the released version. A development
# version (one with a fourth number) builds to /dev/ instead, so the
# documentation people read never runs ahead of the release they have.
development:
  mode: auto
template:
  bootstrap: 5
  includes:
    in_header: |
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-MCVSE5T8BD"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
      
        gtag('config', 'G-MCVSE5T8BD');
      </script>

reference:
- title: Distribution Fitting
- subtitle: Main Function
  contents:
  - fit_dst
- subtitle: Distribution Wrappers
  contents:
  - starts_with("fit_dst_")
- title: Diagnostics
- subtitle: Empirical Rank Statistics
  contents:
  - uscore
  - nscore
  - rpscore
- subtitle: Scoring Metrics
  contents:
  - quantile_score
